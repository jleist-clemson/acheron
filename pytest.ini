[pytest]
# asyncio_mode = auto lets plain `async def test_*` run without per-test markers.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Integration tests (Docker/testcontainers) are deselected by default so the
# unit suite stays fast and hermetic. Run them with: pytest -m integration
addopts = -m "not integration"
markers =
    integration: end-to-end tests requiring Docker (testcontainers); opt in with -m integration
# testcontainers' own internals still call APIs it has since deprecated; these
# warnings come from the library (not our code) when starting Redis/Mongo
# containers. Scope-ignore them by message so our own deprecations still surface.
filterwarnings =
    ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning
    ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning
