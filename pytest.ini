[pytest]
# asyncio_mode = auto lets plain `async def test_*` run without per-test markers.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Integration tests (Docker/testcontainers) are deselected by default so the
# unit suite stays fast and hermetic. Run them with: pytest -m integration
addopts = -m "not integration"
markers =
    integration: end-to-end tests requiring Docker (testcontainers); opt in with -m integration
